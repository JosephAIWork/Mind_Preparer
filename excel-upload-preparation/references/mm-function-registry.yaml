- function: MM_INSTANCE
  category: Instance
  syntax: =MM_INSTANCE(Value, Param, [NanIfNotExists])
  purpose: 'Returns the value of a cell or range for ONE specified instance. A plain reference to a workbook
    that has instances returns the SUM over the linked instances (the rows of /InstanceKeys); MM_INSTANCE
    is how a formula reads one instance instead of that total, and the only way to read a sibling instance
    of the same workbook.

    '
  parameters:
    Value:
      required: true
      type: cell_or_range
      description: Cell or range whose values are returned for the chosen instance (Mind KB, published
        2026-10-20; earlier versions of this registry said a single cell only).
    Param:
      required: true
      type: index_or_name
      description: Index (1-based position in the instance list) or name (instance key) of the instance
        to read.
    NanIfNotExists:
      required: false
      type: boolean
      description: 'If TRUE, returns NaN when the instance does not exist. If FALSE (the default), silently
        returns the initial Excel value of the cell.

        '
  mind_behavior:
  - Reads one instance; a plain cross-workbook reference instead sums all linked instances (Mind's formula
    view marks it /* cross-model SUM */).
  - Can read a sibling instance of the same workbook, which /InstanceKeys links cannot do.
  - Returns all values of a multidimensional cell for the chosen instance, even when that loop does not
    exist in the selected instance (e.g. per-instance loops named with MM_INSTINDEX).
  - Returns NaN for a missing instance only when NanIfNotExists is TRUE; otherwise the Excel value.
  - Under partial load an instance outside the loaded group behaves as missing (Excel default value).
  - Observed 2026-10-22 (a test project) - Mind's upload check (Excel value vs Mind value, before any
    run) reports 0 for MM_INSTANCE(cell, k) with k above 1, even when the instances exist; after a run
    the values are right (1200 and 800). Treat that log line as a false alarm, not a formula error.
  - Asking for the currently selected instance gives the same result as not using the function.
  excel_behavior:
  - Instances do not exist in Excel; the function returns the referenced cell's own Excel value whatever
    Param is.
  validation_rules:
  - Param must identify an existing instance by index or name.
  - Set NanIfNotExists to TRUE when the instance may not exist, or size the calling table to the instance
    count.
  - Wrap in MM_ISINSTANCELOADED when instance groups (/INSTANCESELECT) are used.
  - Review carefully when used with dynamic loops.
  common_mistakes:
  - Using MM_INSTANCE to total instances; a plain reference already sums the linked instances.
  - Summing non-additive values (labels, dates) through a plain reference instead of taking them from
    one instance.
  - Assuming missing instances always return NaN (the default returns the Excel value).
  - Hard-coding instance names that drift from /InstanceKeys; prefer indexes, or keys read from the instance
    table.
  - Using the function when accessing the currently selected instance would give the same result.
  use_when:
  - Reading one specific instance instead of the sum over linked instances.
  - Taking a non-additive value (label, date, setting) from one instance in a consolidated output.
  - Building a table with one row per instance (row k reads instance k).
  - Reading a sibling instance of the same workbook (for example reinsurance reading the underlying portfolios).
  avoid_when:
  - Totalling linked instances; a plain reference does it.
  - Accessing a cell in the same selected instance where no instance lookup is required.
  - Modelling a dimension a loop could carry; Mind recommends loops unless instance features are needed
    (less RAM and CPU).
  patterns:
  - name: Label from one instance
    formula: =MM_INSTANCE(Model!LabelCell, 1)
    note: Consolidated statements keep plain references for amounts (summed) and take the period label
      from instance 1.
  - name: One row per instance
    formula: =MM_INSTANCE(Model!Cell, Index)
    note: The Index column counts 1, 2, 3 (previous + 1) in a grid resized to the instance count; the
      dimensions of Cell come along.
  - name: Instance names list
    formula: =MM_INSTANCE(Loop!KeyCell, Index)
    note: KeyCell holds =MM_INSTANCEKEY(), so the column lists every instance key.
  - name: Gated sibling read
    formula: =IF(IsReinsurance, IF(Row=0, 0, MM_INSTANCE(OFFSET(Source, Row, 0), Index)), 0)
    note: A cheap IF in front keeps instances that do not need the value from evaluating it; OFFSET inside
      the first argument picks the row.
  - name: Partial-load guard
    formula: =IF(MM_ISINSTANCELOADED(A5, "TS2"), MM_INSTANCE(A5, "TS2"), 0)
    note: Returns 0 instead of the Excel default when TS2 is not in the loaded instance group.
  related_functions:
  - MM_INSTINDEX
  - MM_INSTANCEKEY
  - MM_ISINSTANCELOADED
  - MM_INSTANCEUNION
  - MM_LOOPINSTANCE
  sources:
  - Mind KB article functions/instance/mm_instance (published 2026-10-20), read with the Mind MCP get_kb_article
    tool.
  - Mind tutorials instances/intro, instances/calc and instances/partial, read with get_mind_tutorial.
  - Read-only look at a Mind-built IFRS 17 project with 13 portfolio instances, 2026-10-22.
  registry_status: core_v0_1
- function: MM_INSTINDEX
  category: Instance
  syntax: =MM_INSTINDEX()
  purpose: 'Returns the index of the selected instance in a table.

    '
  parameters:
    none:
      required: false
      type: none
      description: No parameters.
  mind_behavior:
  - Returns the selected instance index.
  - Can be used to create loops specific to each instance.
  excel_behavior:
  - Used in formulas that depend on selected or default instance context.
  validation_rules:
  - Instances must be added beforehand.
  - Use with care in loop names because it can create instance-specific loops.
  common_mistakes:
  - Using before instances exist.
  - Forgetting that loops created with instance indexes may be instance-specific.
  - Assuming all instance-specific loops have the same size.
  use_when:
  - Formula needs current instance index.
  - Defining instance-specific loops.
  avoid_when:
  - Formula should be identical across all instances without instance-dependent behaviour.
  related_functions:
  - MM_INSTANCE
  - MM_INSTANCEKEY
  - MM_LOOP
  - MM_COLUMN
  - MM_ROW
  registry_status: core_v0_1
- function: MM_INSTANCEKEY
  category: Instance
  syntax: =MM_INSTANCEKEY(["DefaultKey"])
  purpose: 'Returns the label of the selected instance in a table.

    '
  parameters:
    DefaultKey:
      required: false
      type: string
      description: Label/key returned by the function in Excel. This parameter is not used in Mind.
  mind_behavior:
  - Returns the selected instance label/key once the model has been calculated.
  excel_behavior:
  - Returns the DefaultKey parameter value if supplied.
  validation_rules:
  - Instances must be added beforehand.
  - Use when display or formula logic needs the selected instance label.
  common_mistakes:
  - Assuming DefaultKey is used in Mind.
  - Using before instance setup exists.
  - Using this when the instance index is needed.
  use_when:
  - Need the selected instance label.
  - Need instance-aware display or lookup logic.
  avoid_when:
  - Need the selected instance index; use MM_INSTINDEX.
  related_functions:
  - MM_INSTINDEX
  - MM_INSTANCE
  - MM_ISINSTANCELOADED
  registry_status: core_v0_1
- function: MM_ISINSTANCELOADED
  category: Instance / Partial Load
  syntax: =MM_ISINSTANCELOADED(Cell, InstanceKey)
  purpose: 'Checks if a chosen current value is in an instance loaded in the current model in Mind.

    '
  parameters:
    Cell:
      required: true
      type: cell
      description: Cell containing the value to check. Not meant to be a range bigger than a cell.
    InstanceKey:
      required: true
      type: string
      description: Name of the instance to check.
  mind_behavior:
  - Returns TRUE only if the instance key is loaded by the model in Mind.
  - Useful in partial-load situations to avoid displaying default Excel values for unloaded instances.
  excel_behavior:
  - Used in conditional formulas to protect against unloaded instance references.
  validation_rules:
  - Cell should be a single cell.
  - InstanceKey must match the instance to check.
  - Use in IF conditions when partial load is possible.
  - Add fallback values where unloaded instances should not return default Excel values.
  common_mistakes:
  - Calling unloaded instances without fallback logic.
  - Returning default Excel values unintentionally.
  - Using ranges instead of a single cell.
  - Forgetting to combine with MM_INSTANCE when accessing a value conditionally.
  use_when:
  - Partial load is used.
  - Formula references may point to unloaded instances.
  - You need to avoid default Excel values for unloaded instances.
  avoid_when:
  - All instances are always loaded and no fallback logic is required.
  related_functions:
  - MM_INSTANCE
  - MM_INSTINDEX
  - MM_INSTANCEKEY
  registry_status: core_v0_1
- function: MM_ITERATIONS
  category: Iteration
  syntax: =MM_ITERATIONS("Name", Size)
  purpose: 'Defines iterations on the workbook on which the function is used.

    '
  parameters:
    Name:
      required: true
      type: string
      description: Name of the iteration dimension.
    Size:
      required: true
      type: integer
      description: Number of iterations for the workbook.
  mind_behavior:
  - Causes the workbook to be calculated multiple times for a single run.
  - Can only be used once per workbook.
  excel_behavior:
  - Defines intended iteration structure before upload.
  validation_rules:
  - Only one MM_ITERATIONS function per workbook.
  - Use when a workbook must run sequentially multiple times.
  - Pair with iteration input/output flags where sequential values feed later iterations.
  common_mistakes:
  - Using MM_ITERATIONS more than once in a workbook.
  - Not defining iteration inputs/outputs when sequential dependency is required.
  - Using workbook iterations when a normal loop would be sufficient.
  use_when:
  - Workbook needs repeated sequential calculations.
  - Output from one iteration feeds the next.
  avoid_when:
  - Simple loop dimensions are sufficient.
  - No sequential dependency exists.
  related_functions:
  - MM_CURRENTITERATION
  - MM_READITERATION
  - /CalculationSteps
  - /iterationinput
  - /iterationoutput
  registry_status: core_v0_1
- function: MM_CURRENTITERATION
  category: Iteration
  syntax: =MM_CURRENTITERATION()
  purpose: 'Returns the index of the iteration that is selected or, if not visible, the iteration that
    is calculated.

    '
  parameters:
    none:
      required: false
      type: none
      description: No parameters.
  mind_behavior:
  - If iteration results are saved for display, returns the selected iteration index.
  - If not saved for display, may return the last available index for display.
  - During calculations, returns the correct index for each calculated iteration.
  - Can only be used on a workbook where iterations are defined.
  excel_behavior:
  - Used in formulas that depend on the current iteration index.
  validation_rules:
  - Workbook must have iterations defined.
  - Do not use outside an iterated workbook.
  common_mistakes:
  - Using without MM_ITERATIONS.
  - Expecting displayed value and calculation-time value to always be the same.
  - Using on a workbook without iteration logic.
  use_when:
  - Formula needs current iteration index.
  avoid_when:
  - Workbook does not use iterations.
  related_functions:
  - MM_ITERATIONS
  - MM_READITERATION
  registry_status: core_v0_1
- function: MM_READITERATION
  category: Iteration
  syntax: =MM_READITERATION(Cell, Iteration)
  purpose: 'Retrieves values from a specific iteration in another workbook on which iterations were defined.

    '
  parameters:
    Cell:
      required: true
      type: cell
      description: Cell to read. The cell is from another workbook on which iterations are defined.
    Iteration:
      required: true
      type: integer
      description: Index of the iteration to output.
  mind_behavior:
  - Retrieves a specified iteration value from another workbook.
  - Necessary because iteration loops exist only in the workbooks where iterations are defined.
  excel_behavior:
  - Used in cross-workbook iteration lookup formulas.
  validation_rules:
  - Cell should belong to another workbook with iterations defined.
  - Do not use if Cell belongs to the same workbook as the MM_READITERATION formula.
  - Inside the same workbook, iterations work like a regular loop and dependencies inherit the iteration
    loop.
  common_mistakes:
  - Reading an iteration from the same workbook.
  - Referencing a workbook where iterations are not defined.
  - Using wrong iteration index.
  - Forgetting that same-workbook iteration dependencies inherit the iteration loop automatically.
  use_when:
  - Consolidation workbook needs results from a specific iteration in another workbook.
  avoid_when:
  - The referenced cell is in the same workbook.
  related_functions:
  - MM_ITERATIONS
  - MM_CURRENTITERATION
  - /CalculationSteps
  registry_status: core_v0_1
