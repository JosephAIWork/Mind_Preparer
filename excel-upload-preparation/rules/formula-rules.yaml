version: 1.0.0
rules:
- id: FORMULA-002
  version: 1.0.0
  status: active
  category: formula
  description: VBA functions are not directly compatible with Mind.
  confidence: HIGH
  priority: REQUIRED
  source:
    document: CompleteMindDocn.docx
    article: extensions
  validation:
    deterministic: true
    implementation: validators.formula.detect_vba_udf_calls
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
- id: FRM-001
  version: 1.0.0
  status: active
  category: formula
  description: Formula Inventory -- Audit every formula used.
  confidence: HIGH
  priority: REQUIRED
  source:
    document: 01_Mind_Readiness_Standard.md
    article: FRM-001
  validation:
    deterministic: false
    implementation: validators.formula.frm_001
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
  severity_source: BLOCKER
- id: FRM-002
  version: 1.0.0
  status: active
  category: formula
  description: Unsupported Functions
  confidence: HIGH
  priority: REQUIRED
  source:
    document: 01_Mind_Readiness_Standard.md
    article: FRM-002
  validation:
    deterministic: true
    implementation: validators.formula.unsupported_functions
  correction:
    automatic: false
  on_unevaluable: REQUIRES_USER_INPUT
  pass_if:
  - Every function appears on Mind supported list.
  fail_if:
  - Unsupported function exists.
  severity_source: BLOCKER
- id: FRM-003
  version: 1.0.0
  status: active
  category: formula
  description: 'Dynamic Arrays -- Review: - @ operator - spilled ranges - Office 365 dynamic array behaviour'
  confidence: HIGH
  priority: REQUIRED
  source:
    document: 01_Mind_Readiness_Standard.md
    article: FRM-003
  validation:
    deterministic: false
    implementation: validators.formula.frm_003
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
  severity_source: HIGH
- id: FRM-004
  version: 1.0.0
  status: active
  category: formula
  description: VBA
  confidence: HIGH
  priority: REQUIRED
  source:
    document: 01_Mind_Readiness_Standard.md
    article: FRM-004
  validation:
    deterministic: true
    implementation: validators.formula.vba_presence
  correction:
    automatic: false
  on_unevaluable: REQUIRES_USER_INPUT
  fail_if:
  - VBA logic is required.
  severity_source: BLOCKER
- id: FRM-005
  version: 1.0.0
  status: active
  category: formula
  description: 'Circular References -- a cycle among formula cells stops Mind''s runner ("Run error: Circular reference found").'
  confidence: HIGH
  priority: REQUIRED
  source:
    document: real Mind conversion testing (2026-09-30, model RAROK)
    article: FRM-005
  validation:
    deterministic: true
    implementation: validators.formula.circular_references
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - No formula cell depends on itself, directly or through other cells, ranges or defined names.
  fail_if:
  - A cycle exists among formula cells.
  severity_source: BLOCKER
- id: FRM-006
  version: 1.0.0
  status: active
  category: formula
  description: '3-D References -- ''First:Last''!cell spans several sheets; Mind reads ''First:Last'' as one sheet name ("Sheet ... not found in workbook on compiling formula").'
  confidence: HIGH
  priority: REQUIRED
  source:
    document: real Mind conversion testing (2026-09-30, model PVFP)
    article: FRM-006
  validation:
    deterministic: true
    implementation: validators.formula.three_d_references
  correction:
    automatic: true
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - No formula references a sheet range ('First:Last'!cell).
  fail_if:
  - A formula references a sheet range.
  severity_source: BLOCKER
- id: FRM-007
  version: 1.0.0
  status: active
  category: formula
  description: 'INDIRECT used as a value -- Mind returns a reference for INDIRECT and cannot turn it into a value ("Unable to cast AM.Models.AMReference to System.IConvertible").'
  confidence: HIGH
  priority: REQUIRED
  source:
    document: real Mind conversion testing (2026-10-01, model PVFP)
    article: FRM-007
  validation:
    deterministic: true
    implementation: validators.formula.indirect_as_value
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - No formula compares, multiplies, divides, negates or concatenates the result of INDIRECT.
  fail_if:
  - The result of INDIRECT is used as a value.
  severity_source: BLOCKER
- id: FRM-008
  version: 1.0.0
  status: active
  category: formula
  description: 'Empty text in arithmetic -- Excel stops on "" (#VALUE!) and IFERROR returns its fallback; Mind counts "" as 0 and computes a number.'
  confidence: HIGH
  priority: REQUIRED
  source:
    document: real Mind conversion testing (2026-10-06, model Horizon and a 49-cell test workbook)
    article: FRM-008
  validation:
    deterministic: true
    implementation: validators.formula.blank_text_arithmetic
  correction:
    automatic: true
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - No IFERROR hides arithmetic on a cell that holds "" (empty text).
  fail_if:
  - A formula does arithmetic on a cell that holds "" inside IFERROR and shows the fallback in Excel.
  severity_source: BLOCKER
- id: FRM-009
  version: 1.0.0
  status: active
  category: formula
  description: 'Empty cell compared with a number -- Excel reads the empty cell as 0; Mind does not, so the comparison goes the other way.'
  confidence: HIGH
  priority: REQUIRED
  source:
    document: real Mind conversion testing (2026-10-06, model Horizon and a 49-cell test workbook)
    article: FRM-009
  validation:
    deterministic: true
    implementation: validators.formula.empty_cell_compared
  correction:
    automatic: true
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - No formula compares a number with an empty cell, directly or through a reference or lookup that lands on an empty cell.
  fail_if:
  - A number is compared with an empty cell, or with a formula cell that lands on one.
  severity_source: BLOCKER
- id: FRM-010
  version: 1.0.0
  status: active
  category: formula
  description: 'Empty text as lookup key -- VLOOKUP("") finds nothing in Excel (IFERROR returns its fallback); Mind matches an empty cell of the looked-up column, the header of a titled table, and returns that row.'
  confidence: HIGH
  priority: REQUIRED
  source:
    document: real Mind conversion testing (2026-10-06, model Horizon, column T, and three diagnostic uploads)
    article: FRM-010
  validation:
    deterministic: true
    implementation: validators.formula.blank_text_lookup_key
  correction:
    automatic: true
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - No IFERROR hides an exact lookup whose key holds "" over a column or row with an empty cell.
  fail_if:
  - An exact VLOOKUP / HLOOKUP / MATCH inside IFERROR takes a key that holds "" and searches a column or row that has an empty cell.
  severity_source: BLOCKER
