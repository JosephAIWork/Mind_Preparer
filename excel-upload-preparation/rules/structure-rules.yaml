version: 1.0.0
rules:
- id: GRID-001
  version: 1.0.0
  status: active
  category: structure
  description: Inventory workbook structure as workbooks, sheets, and grids.
  confidence: HIGH
  priority: REQUIRED
  source:
    document: CompleteMindDocn.docx
    article: general-structure-guidelines
  validation:
    deterministic: true
    implementation: validators.structure.inventory_hierarchy
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
- id: GRID-004
  version: 1.0.0
  status: active
  category: structure
  description: A StepLabels grid is alone on a separate sheet.
  confidence: HIGH
  priority: REQUIRED
  source:
    document: CompleteMindDocn.docx
    article: step-labels-grid
  validation:
    deterministic: true
    implementation: validators.structure.step_labels_isolated
  correction:
    automatic: conditional
    approval_required: conditional
  on_unevaluable: REQUIRES_USER_INPUT
- id: STR-001
  version: 1.0.0
  status: active
  category: structure
  description: Grid Detection
  confidence: HIGH
  priority: REQUIRED
  source:
    document: 01_Mind_Readiness_Standard.md
    article: STR-001
  validation:
    deterministic: true
    implementation: validators.structure.grid_detection_heuristic
  correction:
    automatic: false
  on_unevaluable: REQUIRES_USER_INPUT
  pass_if:
  - Intended grids are separated appropriately.
  - Grid boundaries are clear.
  - Empty rows and columns exist where grids must be separated.
  fail_if:
  - Multiple logical grids are merged unintentionally.
  severity_source: BLOCKER
- id: STR-002
  version: 1.0.0
  status: active
  category: structure
  description: Standalone Text Cells
  confidence: HIGH
  priority: RECOMMENDED
  source:
    document: 01_Mind_Readiness_Standard.md
    article: STR-002
  validation:
    deterministic: false
    implementation: validators.structure.str_002
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - Standalone labels are intentional.
  fail_if:
  - User expects standalone text cells to generate navigation items.
  severity_source: MEDIUM
- id: STR-003
  version: 1.0.0
  status: active
  category: structure
  description: Header Recognition
  confidence: HIGH
  priority: REQUIRED
  source:
    document: 01_Mind_Readiness_Standard.md
    article: STR-003
  validation:
    deterministic: false
    implementation: validators.structure.str_003
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - First row contains only text values when headers are intended.
  fail_if:
  - Header row contains formulas or numeric values that prevent recognition.
  severity_source: HIGH
- id: STR-004
  version: 1.0.0
  status: active
  category: structure
  description: Grid Naming
  confidence: HIGH
  priority: RECOMMENDED
  source:
    document: 01_Mind_Readiness_Standard.md
    article: STR-004
  validation:
    deterministic: true
    implementation: validators.structure.grid_naming_heuristic
  correction:
    automatic: false
  on_unevaluable: WARNING
  pass_if:
  - Every important grid is explicitly named.
  fail_if:
  - Grid is given automatic "Untitled" name.
  severity_source: MEDIUM
- id: STR-005
  version: 1.0.0
  status: active
  category: structure
  description: 'Sheet Names -- Pass if: Sheet names are meaningful.'
  confidence: HIGH
  priority: INFORMATIONAL
  source:
    document: 01_Mind_Readiness_Standard.md
    article: STR-005
  validation:
    deterministic: false
    implementation: validators.structure.str_005
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - Sheet names are meaningful.
  severity_source: LOW
- id: STR-006
  version: 1.0.0
  status: active
  category: structure
  description: 'Workbook Names -- Pass if: Workbook names are meaningful.'
  confidence: HIGH
  priority: INFORMATIONAL
  source:
    document: 01_Mind_Readiness_Standard.md
    article: STR-006
  validation:
    deterministic: false
    implementation: validators.structure.str_006
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - Workbook names are meaningful.
  severity_source: LOW
- id: STR-007
  version: 1.0.0
  status: active
  category: structure
  description: 'Hidden Sheets -- Pass if: Hidden sheets use &&Hide intentionally.'
  confidence: HIGH
  priority: INFORMATIONAL
  source:
    document: 01_Mind_Readiness_Standard.md
    article: STR-007
  validation:
    deterministic: true
    implementation: validators.structure.hidden_sheets
  correction:
    automatic: false
  on_unevaluable: WARNING
  pass_if:
  - Hidden sheets use &&Hide intentionally.
  severity_source: INFO
- id: REF-001
  version: 1.0.0
  status: active
  category: structure
  description: Broken Defined-Name References -- a formula referencing a #REF! defined name cannot convert in Mind.
  confidence: HIGH
  priority: REQUIRED
  source:
    document: real Mind conversion testing (2026-08-30)
    article: REF-001
  validation:
    deterministic: true
    implementation: validators.structure.broken_defined_name_refs
  correction:
    automatic: conditional
  on_unevaluable: NOT_SUPPORTED
  severity_source: HIGH
- id: REP-001
  version: 1.0.0
  status: active
  category: structure
  description: Value Reconciliation -- a total (=SUM/addition) whose value does not equal the sum of its addends.
  confidence: HIGH
  priority: RECOMMENDED
  source:
    document: user requirement (number consistency / value reconciliation)
    article: REP-001
  validation:
    deterministic: true
    implementation: validators.structure.totals_reconcile
  correction:
    automatic: false
  on_unevaluable: NOT_SUPPORTED
  severity_source: MEDIUM
- id: REF-002
  version: 1.0.0
  status: active
  category: structure
  description: 'External links in formulas -- a formula that reads another workbook; Mind cannot follow an external link (every such formula is an error there), Excel shows the copy it kept.'
  confidence: HIGH
  priority: REQUIRED
  source:
    document: real Mind conversion testing (2026-10-08, a client model, 20,934 formulas on a link to an unreachable file)
    article: REF-002
  validation:
    deterministic: true
    implementation: validators.structure.external_links_in_formulas
  correction:
    automatic: true
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - No formula reads another workbook and the package holds no external link part.
  fail_if:
  - A formula reads a cell of another workbook.
  severity_source: BLOCKER
- id: STR-008
  version: 1.0.0
  status: active
  category: structure
  description: 'Lone text cell read by formulas -- a text cell with nothing around it (no grid, no title, no label beside it) that a formula reads; Mind imports grids, not loose text cells, and the formula gets nothing.'
  confidence: HIGH
  priority: REQUIRED
  source:
    document: real Mind conversion testing (2026-10-08, a client model and a test workbook)
    article: STR-008
  validation:
    deterministic: true
    implementation: validators.structure.lone_text_cells_read
  correction:
    automatic: true
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - No text cell standing alone on its sheet is read by a formula.
  fail_if:
  - A formula reads a text cell that belongs to no grid and has no title above it or label beside it.
  severity_source: BLOCKER
- id: STR-009
  version: 1.0.0
  status: active
  category: structure
  description: 'Pivot table -- Mind''s converter stops on pivot tables ("The method or operation is not implemented"), plain ones too, not only one with a grouped field. Prep turns every pivot table into formulas or values, per the pivot setting in Advanced.'
  confidence: MEDIUM
  priority: REQUIRED
  source:
    document: real Mind conversion testing (2026-10-18 and 2026-10-25, a client model -- rejected with its 8 pivot tables, rejected with only the grouped one as values, accepted with all of them as values)
    article: STR-009
  validation:
    deterministic: true
    implementation: validators.structure.pivot_tables
  correction:
    automatic: true
  on_unevaluable: NOT_SUPPORTED
  pass_if:
  - The workbook has no pivot table.
  fail_if:
  - A pivot table has a grouped field (blocking), or the workbook has pivot tables (a warning).
  severity_source: BLOCKER
