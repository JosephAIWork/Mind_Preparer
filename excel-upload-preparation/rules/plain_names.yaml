# One short plain name per rule: what is wrong, in the user's words, at most 8 words.
# The app shows it next to the code everywhere a code appears ("FRM-009 · an empty cell is
# compared with a number"), the Excel report included (app/plain_codes.py loads this file once).
#
# Written from each rule's description AND its validator (app/validators/), not from the code alone.
# Every rule needs one, draft rules included: tests/unit/test_rules_engine.py fails on a rule
# without a name, on a name longer than 8 words, and on a name for a rule that does not exist.
# Rules that only list what the workbook holds (they always pass) say "list of ...";
# advice that never blocks says "tip: ...". The values are quoted: ':' and '#' mean something to YAML.

